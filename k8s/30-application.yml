apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: easy-campus-stay
spec:
  selector:
    app: inventory
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: easy-campus-stay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: inventory
        image: easystay/inventory:assignment2
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: '3306'
        - name: DB_NAME
          value: campusstay_inventory
        - name: DB_USER
          value: cs_inventory
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easystay-secrets
              key: INVENTORY_DB_PASSWORD
        - name: BASE_URL
          value: http://inventory:8080
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 384Mi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 3
          failureThreshold: 40
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 4
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 6
---
