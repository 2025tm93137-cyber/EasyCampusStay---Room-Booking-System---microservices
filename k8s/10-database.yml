apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
  namespace: easy-campus-stay
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: easy-campus-stay
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: easy-campus-stay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:10.11
        imagePullPolicy: IfNotPresent
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easystay-secrets
              key: MARIADB_ROOT_PASSWORD
        - name: MARIADB_ROOT_HOST
          value: '%'
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        startupProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 10
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: database-data
  strategy:
    type: Recreate
