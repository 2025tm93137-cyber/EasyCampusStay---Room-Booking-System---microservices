<VirtualHost *:8080>
    DocumentRoot /var/www/easystay-public
    <Directory /var/www/easystay-public>
        Require all granted
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
